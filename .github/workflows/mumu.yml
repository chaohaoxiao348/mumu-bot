name: 木木

on:
  schedule:
    # GitHub 用 UTC 時間，台灣 = UTC+8
    - cron: "12 1 * * *"      # 發文：台灣 09:12
    - cron: "7 5 * * *"       # 發文：台灣 13:07
    - cron: "23 13 * * *"     # 發文：台灣 21:23
    - cron: "41 0-15/2 * * *" # 回留言：台灣 08:41 起每 2 小時，到 23:41
    - cron: "17 3,11 * * *"   # 逛脆：台灣 11:17、19:17（要開 ENABLE_EXPLORE）
    - cron: "52 15 * * *"     # 睡前日記：台灣 23:52
  workflow_dispatch:
    inputs:
      mode:
        description: "post / reply / explore / diary"
        default: "post"
      dry_run:
        description: "1 = 只測試不發文"
        default: "1"

permissions:
  contents: write   # 記憶（memory.json）和發過的照片要存回 repo

concurrency:
  group: mumu        # 一次只跑一個，避免記憶互相覆蓋
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 決定模式
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "41 0-15/2 * * *") echo "mode=reply" >> $GITHUB_OUTPUT ;;
              "17 3,11 * * *")   echo "mode=explore" >> $GITHUB_OUTPUT ;;
              "52 15 * * *")     echo "mode=diary" >> $GITHUB_OUTPUT ;;
              *)                 echo "mode=post" >> $GITHUB_OUTPUT ;;
            esac
          fi
      - run: python bot.py ${{ steps.mode.outputs.mode }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          PHOTO_BASE_URL: ${{ vars.PHOTO_BASE_URL }}
          ENABLE_EXPLORE: ${{ vars.ENABLE_EXPLORE }}
      - name: 存回記憶
        run: |
          git add memory.json || true
          git add photos/used.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "mumu-bot"
            git config user.email "mumu-bot@users.noreply.github.com"
            git commit -m "木木的記憶更新"
            git pull --rebase
            git push
          fi
